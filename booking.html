<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAVE Local Travel | 강릉 여행 상품 예약</title>
<!--
  WAVE Local Travel — 여행 상품 페이지 (포트폴리오용 시안)
  · 언어: 한국어 / English / 日本語 / 简体中文   · 통화: KRW / USD / JPY / CNY (예시 환율)
  · 상품, 가격, 평점, 후기, 사업자 정보는 가상 정보이며 실제 예약·결제는 진행되지 않습니다.
  · 관광지 이름(경포해변, 안목해변 커피거리, 선교장)은 실제 장소입니다.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  :root {
    --navy: #0a1926; --navy2: #12283b; --sand: #f7f4ef; --sand2: #eee8de; --gold: #c9a25d; --gold2: #b38b47;
    --ink: #1a2430; --muted: #6f7680; --line: rgba(10,25,38,.12); --red: #c2493d; --teal: #1f6f86;
    --ease: cubic-bezier(.22,.61,.36,1);
    --en: 'Cormorant Garamond', 'Times New Roman', serif;
    --num: 'Pretendard', 'Helvetica Neue', Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--sand); color: var(--ink); line-height: 1.75; font-weight: 400; -webkit-font-smoothing: antialiased; }

  /* ===== 언어별 글꼴 · 타이포그래피 (OS마다 다르게 보이지 않도록 폴백을 명확히 지정) ===== */
  html:lang(ko) body { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; word-break: keep-all; letter-spacing: -0.005em; }
  html:lang(en) body { font-family: 'Pretendard', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 0; }
  html:lang(ja) body { font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif; letter-spacing: .02em; line-break: strict; }
  html:lang(zh-CN) body { font-family: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Source Han Sans SC', 'Noto Sans CJK SC', sans-serif; letter-spacing: .02em; line-height: 1.8; line-break: strict; }
  html:lang(zh-CN) h1, html:lang(zh-CN) h2, html:lang(zh-CN) h3, html:lang(ja) h1, html:lang(ja) h2, html:lang(ja) h3 { font-weight: 500; letter-spacing: .02em; }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  /* 가격 · 숫자는 모든 언어에서 같은 글꼴과 같은 폭으로 정렬 */
  .money, .num { font-family: var(--num) !important; font-variant-numeric: tabular-nums lining-nums; letter-spacing: 0 !important; }
  a { color: inherit; text-decoration: none; }
  .photo { background-image: var(--img), var(--fb, linear-gradient(160deg, #12283b, #4a6a7c)); background-size: cover; background-position: var(--pos, center); }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 32px; }

  /* ===== 상단 바 ===== */
  .topbar { position: sticky; top: 0; z-index: 60; background: rgba(247,244,239,.96); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .tb { height: 70px; display: flex; align-items: center; gap: 34px; }
  .logo { font-family: var(--en); font-weight: 500; font-size: 22px; letter-spacing: .32em; white-space: nowrap; color: var(--navy); }
  .logo i { font-style: italic; color: var(--gold); letter-spacing: .06em; }
  .logo small { font-family: var(--num); font-size: 11px; letter-spacing: .22em; color: var(--muted); margin-left: 8px; font-weight: 500; }
  nav { display: flex; gap: 26px; font-size: 14px; flex: 1; }
  nav a { padding: 6px 0; position: relative; white-space: nowrap; }
  nav a.on { color: var(--navy); font-weight: 600; }
  nav a.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; background: var(--gold); }
  nav a:hover { color: var(--gold2); }
  .tools { display: flex; align-items: center; gap: 10px; }
  .sel { position: relative; }
  .sel select { appearance: none; -webkit-appearance: none; border: 1px solid var(--line); background: #fff; border-radius: 20px; padding: 7px 30px 7px 14px; font-size: 13px; cursor: pointer; }
  .sel::after { content: "▾"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 10px; color: var(--muted); pointer-events: none; }
  .sel select:focus { outline: 2px solid rgba(201,162,93,.5); }
  .btn-login { border: 1px solid var(--navy); background: var(--navy); color: #fff; border-radius: 20px; padding: 7px 16px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .burger { display: none; width: 38px; height: 38px; border: none; background: none; position: relative; cursor: pointer; }
  .burger i { position: absolute; left: 9px; right: 9px; height: 1.5px; background: var(--navy); }
  .burger i:nth-child(1) { top: 13px; } .burger i:nth-child(2) { top: 19px; } .burger i:nth-child(3) { top: 25px; }

  /* ===== 히어로 + 검색 ===== */
  .hero { position: relative; color: #fff; padding: 96px 0 150px; overflow: hidden; }
  .hero .photo { position: absolute; inset: 0; --pos: center 58%; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,25,38,.55), rgba(10,25,38,.35) 45%, rgba(10,25,38,.75)); }
  .hero .wrap { position: relative; z-index: 2; }
  .hero .k { font-family: var(--en); font-style: italic; font-size: 22px; color: var(--gold); }
  .hero h1 { font-size: clamp(34px, 4.6vw, 60px); font-weight: 300; line-height: 1.3; margin: 12px 0 18px; }
  .hero h1 b { font-weight: 700; }
  .hero p { font-size: 17px; opacity: .9; max-width: 640px; }
  .search { margin-top: 38px; background: #fff; border-radius: 14px; padding: 10px; display: flex; gap: 10px; max-width: 860px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .search .ic { display: grid; place-items: center; width: 44px; color: var(--muted); font-size: 18px; }
  .search input { flex: 1; border: none; outline: none; font-size: 16px; color: var(--ink); padding: 12px 4px; min-width: 0; }
  .search button { border: none; background: var(--navy); color: #fff; border-radius: 10px; padding: 0 30px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .3s; }
  .search button:hover { background: var(--gold2); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 18px; font-size: 13px; }
  .chips span { opacity: .8; margin-right: 4px; }
  .chips button { border: 1px solid rgba(255,255,255,.5); background: rgba(255,255,255,.08); color: #fff; border-radius: 20px; padding: 5px 14px; cursor: pointer; font-size: 13px; }
  .chips button:hover { background: #fff; color: var(--navy); }

  .trust { position: relative; z-index: 3; margin-top: -60px; }
  .trust .row { background: #fff; border: 1px solid var(--line); border-radius: 14px; display: grid; grid-template-columns: repeat(3, 1fr); box-shadow: 0 16px 40px rgba(10,25,38,.08); }
  .trust .it { padding: 24px 28px; display: flex; gap: 16px; align-items: center; }
  .trust .it + .it { border-left: 1px solid var(--line); }
  .trust .ico { width: 44px; height: 44px; flex: none; border-radius: 50%; background: var(--sand2); display: grid; place-items: center; font-size: 19px; color: var(--navy); }
  .trust b { display: block; font-size: 15px; color: var(--navy); }
  .trust small { font-size: 13px; color: var(--muted); }

  /* ===== 상품 목록 ===== */
  section { padding: 90px 0; }
  .sh { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 26px; flex-wrap: wrap; }
  .sh .k { font-family: var(--en); font-style: italic; color: var(--gold2); font-size: 19px; }
  .sh h2 { font-size: 32px; font-weight: 700; color: var(--navy); line-height: 1.35; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tabs button { border: 1px solid var(--line); background: #fff; border-radius: 24px; padding: 9px 18px; font-size: 14px; cursor: pointer; transition: all .25s; }
  .tabs button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .tabs button:hover:not(.on) { border-color: var(--navy); }
  .bar { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 22px; font-size: 14px; color: var(--muted); gap: 12px; flex-wrap: wrap; }
  .bar b { color: var(--navy); }
  .bar .q { color: var(--navy); background: var(--sand2); border-radius: 16px; padding: 3px 4px 3px 12px; margin-left: 8px; }
  .bar .q button { border: none; background: none; cursor: pointer; padding: 0 6px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .card { background: #fff; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); cursor: pointer; transition: transform .35s var(--ease), box-shadow .35s var(--ease); display: flex; flex-direction: column; text-align: left; padding: 0; }
  .card:hover, .card:focus-visible { transform: translateY(-5px); box-shadow: 0 22px 44px rgba(10,25,38,.12); outline: none; }
  .card .pic { position: relative; aspect-ratio: 4/3; overflow: hidden; }
  .card .pic .photo { position: absolute; inset: 0; transition: transform 1s var(--ease); }
  .card:hover .pic .photo { transform: scale(1.06); }
  .badges { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; }
  .bd { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 4px; color: #fff; white-space: nowrap; }
  .bd.excl { background: var(--red); } .bd.instant { background: var(--teal); } .bd.best { background: var(--gold2); }
  .card .off { position: absolute; right: 12px; top: 12px; z-index: 2; background: #fff; color: var(--red); font-size: 12.5px; font-weight: 700; border-radius: 4px; padding: 3px 8px; }
  .card .body { padding: 16px 18px 18px; display: flex; flex-direction: column; flex: 1; }
  .card .loc { font-size: 12.5px; color: var(--muted); }
  .card h3 { font-size: 16.5px; font-weight: 600; line-height: 1.45; color: var(--navy); margin: 4px 0 8px; min-height: 2.9em; }
  .card .rt { font-size: 13px; color: var(--muted); }
  .card .rt b { color: var(--ink); }
  .card .rt .star { color: #e0a321; }
  .card .pr { margin-top: auto; padding-top: 14px; }
  .card .orig { font-size: 13px; color: var(--muted); text-decoration: line-through; }
  .card .now { display: flex; align-items: baseline; gap: 6px; }
  .card .pct { color: var(--red); font-weight: 700; font-size: 18px; }
  .card .val { font-size: 21px; font-weight: 700; color: var(--navy); }
  .card .unit { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .empty { grid-column: 1 / -1; text-align: center; padding: 70px 20px; color: var(--muted); background: #fff; border-radius: 14px; border: 1px dashed var(--line); }
  .fine { font-size: 12px; color: var(--muted); margin-top: 18px; }

  /* ===== 후기 ===== */
  .reviews { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .rv { background: #fff; border-radius: 14px; padding: 28px; border: 1px solid var(--line); display: flex; flex-direction: column; }
  .rv .st { color: #e0a321; letter-spacing: .15em; }
  .rv p { margin: 14px 0 20px; font-size: 15px; line-height: 1.8; color: var(--ink); flex: 1; }
  .rv .who { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
  .rv .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--sand2); color: var(--navy); font-weight: 700; }
  .rv .who b { display: block; color: var(--navy); font-size: 14px; }
  .tag { display: inline-block; font-size: 11.5px; color: var(--gold2); border: 1px solid rgba(201,162,93,.5); border-radius: 20px; padding: 2px 10px; vertical-align: middle; }

  /* ===== FAQ ===== */
  .faq { max-width: 880px; }
  .qa { border-bottom: 1px solid var(--line); }
  .qa button { width: 100%; text-align: left; background: none; border: none; padding: 22px 40px 22px 0; font-size: 16.5px; font-weight: 600; color: var(--navy); cursor: pointer; position: relative; }
  .qa button::after { content: "+"; position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 24px; font-weight: 300; color: var(--gold2); transition: transform .3s; }
  .qa.open button::after { transform: translateY(-50%) rotate(45deg); }
  .qa .a { max-height: 0; overflow: hidden; transition: max-height .4s var(--ease); }
  .qa .a p { padding: 0 0 22px; color: var(--muted); font-size: 15px; }

  /* ===== 푸터 ===== */
  footer { background: var(--navy); color: rgba(255,255,255,.62); padding: 64px 0 40px; font-size: 13px; }
  .ft { display: grid; grid-template-columns: 1.3fr 1fr 1.4fr; gap: 40px; }
  .ft .logo { color: #fff; }
  .ft h4 { color: #fff; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .ft .cs { font-size: 26px; color: #fff; font-weight: 700; margin: 4px 0; }
  .ft dl div { display: flex; gap: 10px; padding: 3px 0; }
  .ft dt { min-width: 120px; color: rgba(255,255,255,.45); }
  .policy { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 40px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,.12); }
  .policy button { background: none; border: none; color: rgba(255,255,255,.8); cursor: pointer; font-size: 13px; padding: 0; }
  .policy button:first-of-type { color: #fff; font-weight: 600; }
  .policy button:hover { color: var(--gold); }
  .legal { margin-top: 18px; font-size: 12px; color: rgba(255,255,255,.42); }

  /* ===== 모달 ===== */
  .modal { position: fixed; inset: 0; z-index: 200; background: rgba(6,17,27,.6); display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity .3s var(--ease); }
  .modal.open { opacity: 1; pointer-events: auto; }
  .box { background: #fff; width: 100%; max-width: 980px; max-height: 90vh; overflow-y: auto; border-radius: 16px; position: relative; transform: translateY(14px); transition: transform .4s var(--ease); }
  .modal.open .box { transform: none; }
  .box.sm { max-width: 520px; }
  .x { position: absolute; right: 14px; top: 12px; z-index: 5; width: 38px; height: 38px; border-radius: 50%; border: none; background: rgba(255,255,255,.92); font-size: 24px; cursor: pointer; line-height: 1; }
  .pd { display: grid; grid-template-columns: 1.1fr 1fr; }
  .pd .left { border-right: 1px solid var(--line); }
  .pd .gal { aspect-ratio: 4/3; position: relative; }
  .pd .gal .photo { position: absolute; inset: 0; }
  .pd .info { padding: 26px 30px 30px; }
  .pd .info h3 { font-size: 22px; font-weight: 700; color: var(--navy); line-height: 1.4; margin: 6px 0 8px; }
  .pd .info h4 { font-size: 14px; font-weight: 700; color: var(--navy); margin: 22px 0 8px; }
  .pd .info p { font-size: 14.5px; color: #4a5560; }
  .pd ul { list-style: none; font-size: 14px; color: #4a5560; }
  .pd ul li { padding: 4px 0 4px 22px; position: relative; }
  .pd ul.inc li::before { content: "✓"; position: absolute; left: 0; color: var(--teal); font-weight: 700; }
  .pd ul.exc li::before { content: "✕"; position: absolute; left: 0; color: var(--red); font-size: 12px; top: 6px; }
  .pd .right { padding: 34px 30px 30px; display: flex; flex-direction: column; gap: 18px; }
  .fld label { display: block; font-size: 13.5px; font-weight: 600; color: var(--navy); margin-bottom: 8px; }
  .fld input[type=date] { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 15px; }
  .fld .err { color: var(--red); font-size: 12.5px; min-height: 1.2em; margin-top: 4px; }
  .pax { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .pax b { display: block; font-size: 15px; color: var(--navy); }
  .pax small { font-size: 12.5px; color: var(--muted); }
  .stp { display: flex; align-items: center; gap: 4px; }
  .stp button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: #fff; font-size: 17px; cursor: pointer; }
  .stp button:disabled { opacity: .35; cursor: default; }
  .stp span { min-width: 34px; text-align: center; font-size: 17px; font-weight: 600; }
  .sum { background: var(--sand); border-radius: 12px; padding: 18px 20px; font-size: 14px; }
  .sum .ln { display: flex; justify-content: space-between; padding: 3px 0; color: var(--muted); }
  .sum .tot { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); margin-top: 10px; padding-top: 12px; color: var(--navy); font-weight: 600; }
  .sum .tot b { font-size: 26px; font-weight: 800; }
  .sum .fx { font-size: 12px; color: var(--muted); margin-top: 6px; text-align: right; }
  .book { border: none; background: var(--navy); color: #fff; border-radius: 12px; padding: 17px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background .3s; }
  .book:hover { background: var(--gold2); }
  .policy-hint { font-size: 12.5px; color: var(--muted); }
  .policy-hint button { background: none; border: none; color: var(--navy); text-decoration: underline; cursor: pointer; font-size: 12.5px; padding: 0; }
  .doc { padding: 40px 36px 34px; }
  .doc .k { font-family: var(--en); font-style: italic; color: var(--gold2); font-size: 18px; }
  .doc h3 { font-size: 21px; color: var(--navy); margin: 6px 0 16px; }
  .doc p, .doc li { font-size: 14.5px; color: #4a5560; }
  .doc ul { padding-left: 18px; margin: 8px 0; }
  .doc .note { margin-top: 18px; font-size: 12.5px; color: var(--muted); background: var(--sand); border-radius: 8px; padding: 10px 14px; }
  .doc .ok { margin-top: 24px; border: none; background: var(--navy); color: #fff; border-radius: 10px; padding: 13px 28px; font-size: 15px; cursor: pointer; }
  .doc dl div { display: flex; justify-content: space-between; gap: 20px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .doc dt { color: var(--muted); }
  .doc dd { color: var(--navy); font-weight: 600; text-align: right; }

  /* 모바일 메뉴 */
  .drawer { position: fixed; inset: 0; z-index: 150; pointer-events: none; }
  .drawer .dim { position: absolute; inset: 0; background: rgba(6,17,27,.5); opacity: 0; transition: opacity .3s; }
  .drawer .panel { position: absolute; right: 0; top: 0; bottom: 0; width: min(84vw, 340px); background: var(--sand); padding: 22px 26px; transform: translateX(100%); transition: transform .4s var(--ease); overflow-y: auto; }
  .drawer.open { pointer-events: auto; }
  .drawer.open .dim { opacity: 1; }
  .drawer.open .panel { transform: none; }
  .drawer .dh { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .drawer .dh button { border: none; background: none; font-size: 30px; font-weight: 300; cursor: pointer; }
  .drawer a, .drawer .dl { display: block; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 16px; color: var(--navy); }
  .drawer .dl { color: var(--muted); font-size: 13px; border: none; padding-bottom: 6px; }
  .drawer .sels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .drawer .sel select { width: 100%; }

  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 900px) {
    nav, .tools .sel, .btn-login { display: none; }
    .burger { display: block; }
    .tb { justify-content: space-between; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .reviews { grid-template-columns: 1fr; }
    .trust .row { grid-template-columns: 1fr; }
    .trust .it + .it { border-left: none; border-top: 1px solid var(--line); }
    .pd { grid-template-columns: 1fr; }
    .pd .left { border-right: none; }
    .ft { grid-template-columns: 1fr; }
    .modal { padding: 0; align-items: flex-end; }
    .box { max-height: 94vh; border-radius: 16px 16px 0 0; }
  }
  @media (max-width: 560px) {
    .wrap { padding: 0 18px; }
    .logo { font-size: 17px; letter-spacing: .22em; }
    .logo small { display: none; }
    .hero { padding: 64px 0 120px; }
    .search { flex-wrap: wrap; }
    .search .ic { display: none; }
    .search input { flex-basis: 100%; padding: 10px; }
    .search button { flex: 1; padding: 13px; }
    .grid { grid-template-columns: 1fr; }
    .card { flex-direction: row; }
    .card .pic { width: 40%; aspect-ratio: auto; min-height: 170px; }
    .card .badges { left: 8px; top: 8px; }
    .card .off { display: none; }
    .card h3 { font-size: 15px; min-height: 0; }
    .card .val { font-size: 18px; }
    section { padding: 64px 0; }
    .sh h2 { font-size: 26px; }
  }
</style>
</head>
<body>

/* =========================================================
   4. 상태 · 도구
   ========================================================= */
const $ = (q, el = document) => el.querySelector(q);
const $$ = (q, el = document) => [...el.querySelectorAll(q)];
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const params = new URLSearchParams(location.search);
let lang = params.get('lang') || store.get('wl_lang') || 'ko';
let cur = params.get('cur') || store.get('wl_cur') || 'KRW';
if (!I18N[lang]) lang = 'ko';
if (!FX[cur]) cur = 'KRW';
let cat = 'all', query = '', sort = 'rec';
const T = (k, vars = {}) => (I18N[lang][k] ?? I18N.ko[k] ?? k).replace(/\{(\w+)\}/g, (_, v) => vars[v] ?? '');
const money = krw => { const f = FX[cur]; const v = krw / f.rate; return f.sym + v.toLocaleString('en-US', { maximumFractionDigits: f.dec, minimumFractionDigits: f.dec }); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* =========================================================
   5. 언어 적용 (글꼴은 필요할 때만 불러옴)
   ========================================================= */
function loadFont(l) {
  if (!FONT_URL[l] || document.getElementById('font-' + l)) return;
  const link = document.createElement('link'); link.id = 'font-' + l; link.rel = 'stylesheet'; link.href = FONT_URL[l];
  document.head.appendChild(link);
}
function applyLang() {
  loadFont(lang);
  document.documentElement.lang = HTML_LANG[lang];
  $$('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  $$('[data-i18n-html]').forEach(el => { el.innerHTML = T(el.dataset.i18nHtml); });
  $$('[data-i18n-ph]').forEach(el => { el.placeholder = T(el.dataset.i18nPh); });
  $$('[data-chip]').forEach(b => { b.textContent = T('chip.' + b.dataset.chip); });
  $$('.langSel').forEach(s => s.value = lang);
  $$('.curSel').forEach(s => s.value = cur);
  document.title = 'WAVE Local Travel | ' + T('list.title');
  renderList(); renderReviews(); renderFaq();
  if (openState) openState.rerender();
}

/* =========================================================
   6. 상품 목록 · 검색 · 필터 · 정렬
   ========================================================= */
function cardHTML(p) {
  const pct = p.orig ? Math.round((1 - p.price / p.orig) * 100) : 0;
  return `<button class="card" data-id="${p.id}" aria-label="${esc(p.t[lang])}">
    <div class="pic"><div class="photo" style="--img:${p.img}"></div>
      <div class="badges">${p.badges.map(b => `<span class="bd ${b}">${T('bd.' + b)}</span>`).join('')}</div>
      ${pct ? `<span class="off num">-${pct}%</span>` : ''}</div>
    <div class="body">
      <div class="loc">${p.loc[lang]}</div>
      <h3>${p.t[lang]}</h3>
      <div class="rt"><span class="star">★</span> <b class="num">${p.rating.toFixed(1)}</b> <span class="num">(${p.reviews.toLocaleString('en-US')})</span></div>
      <div class="pr">
        ${p.orig ? `<div class="orig money">${money(p.orig)}</div>` : '<div class="orig" style="visibility:hidden">-</div>'}
        <div class="now">${pct ? `<span class="pct num">${pct}%</span>` : ''}<span class="val money">${money(p.price)}~</span></div>
        <div class="unit">${T(p.unit === 'room' ? 'unit.room' : 'unit.person')}</div>
      </div>
    </div></button>`;
}
function filtered() {
  const q = query.trim().toLowerCase();
  let list = PRODUCTS.filter(p => (cat === 'all' || p.cat === cat) && (!q || [p.t.ko, p.t.en, p.t.ja, p.t.zh, p.loc.ko, p.loc.en, p.loc.ja, p.loc.zh, p.kw].join(' ').toLowerCase().includes(q)));
  if (sort === 'low') list.sort((a, b) => a.price - b.price);
  else if (sort === 'rate') list.sort((a, b) => b.rating - a.rating || b.reviews - a.reviews);
  else list.sort((a, b) => a.rec - b.rec);
  return list;
}
function renderList() {
  const list = filtered();
  $('#count').innerHTML = T('list.count', { n: list.length });
  $('#qTag').innerHTML = query.trim() ? `<span class="q">“${esc(query.trim())}” <button id="clearQ" aria-label="clear">×</button></span>` : '';
  $('#grid').innerHTML = list.length ? list.map(cardHTML).join('')
    : `<div class="empty">${T('list.empty')}<br><br><button class="tabs-reset" style="border:1px solid var(--navy);background:#fff;border-radius:20px;padding:8px 18px;cursor:pointer" id="resetAll">${T('list.reset')}</button></div>`;
  $$('#sort option').forEach(o => o.textContent = T(o.dataset.i18n));
  $('#sort').value = sort;
}
$('#grid').addEventListener('click', e => {
  if (e.target.closest('#resetAll')) { query = ''; cat = 'all'; $('#q').value = ''; $$('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.cat === 'all')); renderList(); return; }
  const c = e.target.closest('.card'); if (c) openProduct(c.dataset.id);
});
$('#count').parentElement.addEventListener('click', e => { if (e.target.id === 'clearQ') { query = ''; $('#q').value = ''; renderList(); } });
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  cat = b.dataset.cat; $$('#tabs button').forEach(x => x.classList.toggle('on', x === b)); renderList();
});
$('#sort').addEventListener('change', e => { sort = e.target.value; renderList(); });
$('#searchForm').addEventListener('submit', e => { e.preventDefault(); query = $('#q').value; renderList(); $('#list').scrollIntoView({ behavior: 'smooth' }); });
$('#q').addEventListener('input', e => { query = e.target.value; renderList(); });
$$('[data-chip]').forEach(b => b.addEventListener('click', () => { query = b.textContent; $('#q').value = query; renderList(); $('#list').scrollIntoView({ behavior: 'smooth' }); }));

/* =========================================================
   7. 후기 · FAQ
   ========================================================= */
function renderReviews() {
  $('#rvGrid').innerHTML = REVIEWS.map(r => {
    const p = PRODUCTS.find(x => x.id === r.p);
    return `<div class="rv"><div class="st">${'★'.repeat(r.s)}${'☆'.repeat(5 - r.s)}</div><p>“${r.t[lang]}”</p>
      <div class="who"><span class="av">${r.n[0]}</span><div><b>${r.n}</b>${p.t[lang]}</div></div></div>`;
  }).join('');
}
function renderFaq() {
  $('#faqList').innerHTML = FAQ[lang].map(([q, a], i) => `<div class="qa"><button aria-expanded="false" aria-controls="fa${i}">${q}</button><div class="a" id="fa${i}"><p>${a}</p></div></div>`).join('');
}
$('#faqList').addEventListener('click', e => {
  const b = e.target.closest('.qa > button'); if (!b) return;
  const qa = b.parentElement, a = $('.a', qa), open = !qa.classList.contains('open');
  qa.classList.toggle('open', open); b.setAttribute('aria-expanded', open);
  a.style.maxHeight = open ? a.scrollHeight + 'px' : '0';
});

/* =========================================================
   8. 모달 (상품 상세 · 예약 · 약관 · 로그인)
   ========================================================= */
const modal = $('#modal'), box = $('#box'), mc = $('#mc');
let openState = null, lastFocus = null;
function openModal(render, small) {
  lastFocus = document.activeElement;
  openState = { rerender: render }; box.classList.toggle('sm', !!small);
  render(); modal.classList.add('open'); document.body.style.overflow = 'hidden'; box.scrollTop = 0;
  setTimeout(() => $('.x', box).focus(), 50);
}
function closeModal() { modal.classList.remove('open'); document.body.style.overflow = ''; openState = null; if (lastFocus) lastFocus.focus(); }
modal.addEventListener('click', e => {
  if (e.target === modal || e.target.closest('[data-mclose]')) closeModal();
  const d = e.target.closest('[data-doc]'); if (d) openDoc(d.dataset.doc);
});
addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeDrawer(); } });

const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
function openProduct(id) {
  const p = PRODUCTS.find(x => x.id === id);
  const st = { adult: 2, child: 0, date: '', err: false };
  const minD = new Date(); minD.setDate(minD.getDate() + 1);
  const isRoom = p.unit === 'room';
  const total = () => isRoom ? p.price : p.price * st.adult + Math.round(p.price * 0.7 / 100) * 100 * st.child;
  const childPrice = Math.round(p.price * 0.7 / 100) * 100;
  const render = () => {
    mc.innerHTML = `<div class="pd">
      <div class="left">
        <div class="gal"><div class="photo" style="--img:${p.img}"></div><div class="badges">${p.badges.map(b => `<span class="bd ${b}">${T('bd.' + b)}</span>`).join('')}</div></div>
        <div class="info">
          <div class="loc" style="font-size:13px;color:var(--muted)">${p.loc[lang]} · <span class="star" style="color:#e0a321">★</span> <span class="num">${p.rating.toFixed(1)} (${p.reviews})</span></div>
          <h3>${p.t[lang]}</h3>
          <h4>${T('pd.overview')}</h4><p>${p.d[lang]}</p>
          <h4>${T('pd.inc')}</h4><ul class="inc">${p.inc[lang].map(x => `<li>${x}</li>`).join('')}</ul>
          <h4>${T('pd.exc')}</h4><ul class="exc">${p.exc[lang].map(x => `<li>${x}</li>`).join('')}</ul>
        </div>
      </div>
      <div class="right">
        <div class="fld"><label for="dt">${T(isRoom ? 'pd.checkin' : 'pd.date')}</label><input type="date" id="dt" min="${iso(minD)}" value="${st.date}"><div class="err" id="dtErr">${st.err ? T('pd.dateErr') : ''}</div></div>
        <div class="fld"><label>${T('pd.guests')}</label>
          <div class="pax"><div><b>${T('pd.adult')}</b><small>${isRoom ? T('pd.adultS') : `${T('pd.adultS')} · <span class="money">${money(p.price)}</span>`}</small></div>
            <div class="stp"><button data-k="adult" data-d="-1" ${st.adult <= 1 ? 'disabled' : ''} aria-label="-">−</button><span class="num" id="nA">${st.adult}</span><button data-k="adult" data-d="1" ${(isRoom && st.adult + st.child >= p.max) || st.adult >= 9 ? 'disabled' : ''} aria-label="+">+</button></div></div>
          ${p.child ? `<div class="pax"><div><b>${T('pd.child')}</b><small>${isRoom ? '' : `${T('pd.childS')} · <span class="money">${money(childPrice)}</span>`}</small></div>
            <div class="stp"><button data-k="child" data-d="-1" ${st.child <= 0 ? 'disabled' : ''} aria-label="-">−</button><span class="num" id="nC">${st.child}</span><button data-k="child" data-d="1" ${(isRoom && st.adult + st.child >= p.max) || st.child >= 9 ? 'disabled' : ''} aria-label="+">+</button></div></div>` : ''}
          ${isRoom ? `<small style="color:var(--muted);font-size:12.5px">${T('pd.roomS', { n: p.max })}</small>` : ''}
        </div>
        <div class="sum">
          ${isRoom ? `<div class="ln"><span>${T('pd.room')}</span><span class="money">${money(p.price)}</span></div>`
            : `<div class="ln"><span>${T('pd.adult')} × <span class="num">${st.adult}</span></span><span class="money">${money(p.price * st.adult)}</span></div>
               ${st.child ? `<div class="ln"><span>${T('pd.child')} × <span class="num">${st.child}</span></span><span class="money">${money(childPrice * st.child)}</span></div>` : ''}`}
          <div class="tot"><span>${T('pd.total')}</span><b class="money" id="tot">${money(total())}</b></div>
          ${cur !== 'KRW' ? `<div class="fx">${T('pd.fx', { c: cur })} (₩${total().toLocaleString('en-US')})</div>` : ''}
        </div>
        <button class="book" id="bookBtn">${T('pd.book')}</button>
        <div class="policy-hint">${T('pd.policy')}</div>
      </div></div>`;
    $('#dt').addEventListener('change', e => { st.date = e.target.value; st.err = false; $('#dtErr').textContent = ''; });
    $$('.stp button', mc).forEach(b => b.addEventListener('click', () => { st[b.dataset.k] += +b.dataset.d; render(); }));
    $('#bookBtn').addEventListener('click', () => {
      if (!st.date || st.date < $('#dt').min) { st.err = true; $('#dtErr').textContent = T('pd.dateErr'); $('#dt').focus(); return; }
      openModal(() => confirmView(p, st, total()), true);
    });
  };
  openModal(render);
}
function confirmView(p, st, tot) {
  mc.innerHTML = `<div class="doc"><div class="k">${T('cf.k')}</div><h3>${T('cf.title')}</h3>
    <dl><div><dt>${T('cf.prod')}</dt><dd>${p.t[lang]}</dd></div><div><dt>${T('cf.date')}</dt><dd class="num">${st.date}</dd></div>
    <div><dt>${T('cf.guests')}</dt><dd>${T('cf.pax', { a: st.adult, c: st.child })}</dd></div><div><dt>${T('cf.total')}</dt><dd class="money">${money(tot)}</dd></div></dl>
    <div class="note">${T('cf.note')}</div><button class="ok" data-mclose>${T('cf.ok')}</button></div>`;
}
function openDoc(key) {
  openModal(() => {
    const [title, items] = DOCS[key][lang];
    mc.innerHTML = `<div class="doc"><div class="k">WAVE Local Travel</div><h3>${T('doc.' + key)}</h3><p>${title}</p><ul>${items.map(x => `<li>${x}</li>`).join('')}</ul><div class="note">${T('doc.note')}</div><button class="ok" data-mclose>${T('cf.ok')}</button></div>`;
  }, true);
}
function openLogin() {
  openModal(() => { mc.innerHTML = `<div class="doc"><div class="k">WAVE Local Travel</div><h3>${T('login.title')}</h3><p>${T('login.body')}</p><button class="ok" data-mclose>${T('cf.ok')}</button></div>`; }, true);
}
$$('.policy [data-doc]').forEach(b => b.addEventListener('click', () => openDoc(b.dataset.doc)));
$$('[data-open="login"]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); closeDrawer(); openLogin(); }));

/* =========================================================
   9. 언어 · 통화 선택, 모바일 메뉴
   ========================================================= */
$$('.langSel').forEach(s => s.addEventListener('change', e => { lang = e.target.value; store.set('wl_lang', lang); applyLang(); }));
$$('.curSel').forEach(s => s.addEventListener('change', e => { cur = e.target.value; store.set('wl_cur', cur); applyLang(); }));
const drawer = $('#drawer');
function closeDrawer() { drawer.classList.remove('open'); document.body.style.overflow = modal.classList.contains('open') ? 'hidden' : ''; }
$('#burger').addEventListener('click', () => { drawer.classList.add('open'); document.body.style.overflow = 'hidden'; });
$$('[data-close]', drawer).forEach(el => el.addEventListener('click', closeDrawer));

applyLang();
</script>
</body>
</html>
